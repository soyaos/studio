name: Validate Studio release

# Release publication validates that the immutable tag still produces a
# deployable bundle. soyaos/soyaos polls published releases and opens the
# destination-repository PR with its own short-lived GITHUB_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Studio release tag to validate; defaults to the newest published release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${REQUESTED_TAG}}"
          if [ -z "${tag}" ]; then
            tag="$(gh api repos/soyaos/studio/releases --jq 'map(select(.draft == false)) | first | .tag_name')"
          fi
          if [[ ! "${tag}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid or missing Studio release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist
        run: bun run build

      - name: Upload validated dist
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist-${{ steps.release.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
